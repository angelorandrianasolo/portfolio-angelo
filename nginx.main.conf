# =========================================================
# Configuration principale Nginx — exécution SANS privilèges
#
# Le conteneur web tourne avec `USER nginx` (aucun privilège) : le pid et
# les répertoires temporaires doivent donc être écrits dans /tmp, seul
# répertoire en écriture pour l'utilisateur nginx.
# =========================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporaires de requêtes : écrits par les workers (utilisateur nginx).
    # Chemins plats dans /tmp : Nginx ne crée qu'un seul niveau de
    # répertoire, le parent doit donc exister déjà (/tmp existe toujours).
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 65;

    # Accès aux journaux : les liens symboliques de l'image officielle
    # pointent vers /dev/stdout et /dev/stderr.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    include /etc/nginx/conf.d/*.conf;
}
