# =========================================================
# Nginx — reverse proxy du portfolio
#
# Un seul port, une seule origine : le navigateur parle à
# Nginx, qui route /api/ et /media/ vers le conteneur Django.
# Aucun CORS n'est donc nécessaire.
#
# HTTPS : voir nginx.https.conf.example + section « Sécurité »
# du README (Let's Encrypt + HSTS).
# =========================================================

# --- Content-Security-Policy ----------------------------------------
# Variable unique réutilisée par tous les blocs : en Nginx, un bloc qui
# déclare add_header n'hérite PLUS des en-têtes du serveur, il faut donc
# les redéclarer à chaque fois.
#
#   script-src 'self'          → aucun script inline (le thème est
#                                 externalisé dans js/theme-init.js)
#   style-src ... 'unsafe-inline' → attributs style du HTML + Google Fonts
#   object-src 'none'          → pas de plugin (Flash, etc.)
#   frame-ancestors 'self'     → personne ne peut intégrer le site en iframe
map $uri $csp_value {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests";
}

server {
    # Port 8080 : le conteneur tourne sans privilège (USER nginx),
    # il ne peut pas écouter sur le port 80.
    listen 8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # --- API Django -------------------------------------------------------
    # ^~ empêche les règles regex statiques de capturer ces chemins.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # $http_host et non $host : $host supprime le port, ce qui fait
        # échouer la comparaison d'origine du middleware CSRF de Django
        # (« http://localhost » != « http://localhost:8080 » → 403).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    # --- Healthcheck (compose + monitorings) -----------------------------
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # --- Médias téléversés depuis le back-office --------------------------
    location ^~ /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }

    # --- Fichiers statiques ----------------------------------------------
    # Pas de cache long : les noms de fichiers ne sont pas hachés
    # (js/admin.js et non js/admin.7f3a9c2e.js). Un max-age de 30 jours
    # garderait un ancien admin.js dans le navigateur pendant un mois,
    # ce qui casse la connexion après chaque mise a jour.
    # no-cache = le navigateur revalide a chaque fois via ETag/304 :
    # contenu toujours fraichement servi, bande passante quasi nulle.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # --- Sécurité (redéclarée : voir note sur add_header) ------------
        add_header Content-Security-Policy $csp_value always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Pages HTML : toujours revalidees --------------------------------
    # Sans en-tete, le navigateur applique une mise en cache heuristique :
    # il peut conserver un admin.html ancien, qui reference alors un
    # js/admin.js obslete (bloque 30 jours par l'ancien max-age).
    # no-cache = revalidation ETag a chaque chargement, cout quasi nul.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # --- Sécurité (redéclarée : voir note sur add_header) ------------
        add_header Content-Security-Policy $csp_value always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- Back-office : jamais indexé ---------------------------------------
    # Correspondance EXACTE : elle prime sur le regex *.html ci-dessus,
    # il faut donc y redéclarer Cache-Control ET les en-têtes de sécurité.
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        # --- Sécurité (redéclarée : voir note sur add_header) ------------
        add_header Content-Security-Policy $csp_value always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # --- Pages -------------------------------------------------------------
    location = /robots.txt {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Sécurité (héritée par /api/, /media/, /health, /robots.txt) ------
    add_header Content-Security-Policy $csp_value always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
